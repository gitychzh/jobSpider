<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>招聘信息聚合 - jobSpider</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
    <!-- Open Graph -->
    <meta property="og:title" content="招聘信息聚合 - jobSpider">
    <meta property="og:description" content="多平台招聘数据一览 - 51job·智联·Boss">
    <meta property="og:type" content="website">
    <meta name="description" content="多平台招聘数据聚合，覆盖江苏+上海17城，实时更新">
</head>
<body>

<div class="header">
    <h1>🔍 招聘信息聚合</h1>
    <div class="subtitle">多平台招聘数据一览 · 江苏上海17城</div>
    <div class="stats-row">
        <div class="stat-card">职位 <span class="num" id="totalJobs">-</span> 条</div>
        <div class="stat-card">公司 <span class="num" id="totalCompanies">-</span> 家</div>
        <div class="stat-card" id="cityStats"></div>
    </div>
    <div class="last-update">更新时间: <span id="lastUpdate">-</span>
        <span id="freshIndicator" class="fresh-indicator"></span>
    </div>
</div>

<div class="tabs">
    <button class="tab-btn active" data-source="job51" onclick="switchSource('job51')">
        51job <span class="tab-badge">17城</span>
    </button>
    <button class="tab-btn" data-source="zhilian" onclick="switchSource('zhilian')">
        智联招聘 <span class="tab-badge">开发中</span>
    </button>
    <button class="tab-btn" data-source="boss" onclick="switchSource('boss')">
        Boss直聘 <span class="tab-badge">开发中</span>
    </button>
</div>

<div class="controls">
    <label>城市</label>
    <select id="cityFilter" onchange="loadJobs(1)">
        <option value="">全部城市</option>
    </select>
    <label>学历</label>
    <select id="educationFilter" onchange="loadJobs(1)">
        <option value="">不限</option>
        <option value="大专">大专</option>
        <option value="本科">本科</option>
        <option value="硕士">硕士</option>
        <option value="博士">博士</option>
        <option value="中专">中专/中技</option>
        <option value="高中">高中</option>
        <option value="初中">初中及以下</option>
    </select>
    <label>排序</label>
    <select id="sortField" onchange="loadJobs(1)">
        <option value="issue_date">发布时间</option>
        <option value="confirm_date">确认时间</option>
        <option value="update_time">更新时间</option>
    </select>
    <select id="sortOrder" onchange="loadJobs(1)">
        <option value="desc">从新到旧</option>
        <option value="asc">从旧到新</option>
    </select>
</div>

<div class="controls">
    <input type="text" id="searchBox" placeholder="搜索职位/公司/区域..." style="flex:1;min-width:200px;">
    <button class="btn btn-light" onclick="filterJobs()">搜索</button>
    <button class="btn btn-secondary" onclick="clearFilters()">清空筛选</button>
    <button class="btn btn-primary" onclick="refreshData()" title="刷新数据">↻</button>
</div>

<div class="info-bar" id="infoBar"></div>

<!-- 可展开的统计面板 -->
<div class="stats-panel-toggle" id="statsToggle" onclick="toggleStatsPanel()">
    ▼ 查看详细统计
</div>
<div class="stats-panel" id="statsPanel"></div>

<div class="jobs-list" id="jobsList">
    <div class="loading-box"><span class="spinner"></span><br>加载中...</div>
</div>

<div class="pagination" id="pagination"></div>

<footer class="footer">
    <p>jobSpider · 数据来自51job等公开招聘平台 · 自动更新</p>
    <p>仅展示近1个月发布的职位 · 数据仅供参考</p>
</footer>

<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
