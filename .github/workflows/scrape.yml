name: Scrape & Deploy

on:
  schedule:
    # 北京时间 10:00 = UTC 02:00
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      pages_per_city:
        description: '每城市爬取页数'
        required: false
        default: '5'

permissions:
  contents: write

concurrency:
  group: "scrape"
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run scrapers
        run: |
          python -m scrapers.runner --source job51 --pages ${Pages}
        env:
          Pages: ${{ github.event.inputs.pages_per_city || '5' }}

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/
          git diff --staged --quiet || git commit -m "auto: update job data"
          git push

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: fcd03f4fb32acc1f7073a1fd13645fe6
          command: pages deploy web/ --project-name=jobspider --branch=main